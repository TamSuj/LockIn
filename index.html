<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockIn - Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .title {
            color: #87CEEB;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .penguin-container {
            margin: 20px 0;
            font-size: 4rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .status {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .status.focus {
            color: #4A90E2;
        }

        .status.break {
            color: #50C878;
        }

        .timer {
            font-size: 5rem;
            font-weight: 700;
            color: #333;
            margin: 30px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #87CEEB;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(135, 206, 235, 0.3);
        }

        button:hover {
            background: #6CB4DD;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(135, 206, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.pause {
            background: #FF6B6B;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        button.pause:hover {
            background: #EE5A5A;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .cycle-info {
            margin-top: 30px;
            color: #999;
            font-size: 0.95rem;
        }

        .cycle-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #E0E0E0;
            transition: all 0.3s ease;
        }

        .dot.completed {
            background: #87CEEB;
        }

        .dot.current {
            background: #4A90E2;
            transform: scale(1.3);
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .title {
                font-size: 1.5rem;
            }

            .penguin-container {
                font-size: 3rem;
            }

            .timer {
                font-size: 3.5rem;
            }

            .status {
                font-size: 1rem;
            }

            button {
                padding: 15px 30px;
                font-size: 1rem;
            }
        }

        @media (max-width: 360px) {
            .timer {
                font-size: 3rem;
            }

            .penguin-container {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🐧 LockIn</h1>
        
        <div class="penguin-container" id="penguin">
            <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Penguin body -->
                <ellipse cx="60" cy="70" rx="35" ry="40" fill="#333"/>
                <!-- Penguin belly -->
                <ellipse cx="60" cy="75" rx="25" ry="30" fill="white"/>
                <!-- Penguin head -->
                <circle cx="60" cy="35" r="25" fill="#333"/>
                <!-- Left eye -->
                <ellipse cx="52" cy="32" rx="6" ry="8" fill="white"/>
                <circle cx="52" cy="34" r="3" fill="#333"/>
                <!-- Right eye -->
                <ellipse cx="68" cy="32" rx="6" ry="8" fill="white"/>
                <circle cx="68" cy="34" r="3" fill="#333"/>
                <!-- Beak -->
                <path d="M 60 38 L 55 45 L 65 45 Z" fill="#FFA500"/>
                <!-- Left wing -->
                <ellipse cx="32" cy="75" rx="12" ry="25" fill="#333" transform="rotate(-20 32 75)"/>
                <!-- Right wing -->
                <ellipse cx="88" cy="75" rx="12" ry="25" fill="#333" transform="rotate(20 88 75)"/>
                <!-- Left foot -->
                <ellipse cx="50" cy="108" rx="8" ry="5" fill="#FFA500"/>
                <!-- Right foot -->
                <ellipse cx="70" cy="108" rx="8" ry="5" fill="#FFA500"/>
            </svg>
        </div>

        <div class="status" id="status">Focus Time</div>
        
        <div class="timer" id="timer">25:00</div>
        
        <div class="controls">
            <button id="startBtn" onclick="toggleTimer()">Start</button>
        </div>

        <div class="cycle-info">
            <div id="cycleText">Cycle 1 of 4</div>
            <div class="cycle-dots" id="cycleDots">
                <div class="dot current"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <script>
        // Timer configuration (in seconds)
        const FOCUS_TIME = 25 * 60;      // 25 minutes
        const SHORT_BREAK = 5 * 60;      // 5 minutes
        const LONG_BREAK = 15 * 60;      // 15 minutes (standard long break)
        const CYCLES_BEFORE_LONG_BREAK = 4;

        // State
        let timeRemaining = FOCUS_TIME;
        let isRunning = false;
        let currentCycle = 1;
        let isBreak = false;
        let intervalId = null;

        // Elements
        const timerDisplay = document.getElementById('timer');
        const statusDisplay = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const cycleText = document.getElementById('cycleText');
        const cycleDots = document.getElementById('cycleDots');

        // Format time display
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update timer display
        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeRemaining);
            
            // Update status
            if (isBreak) {
                statusDisplay.textContent = currentCycle > CYCLES_BEFORE_LONG_BREAK ? 'Long Break' : 'Short Break';
                statusDisplay.className = 'status break';
            } else {
                statusDisplay.textContent = 'Focus Time';
                statusDisplay.className = 'status focus';
            }

            // Update cycle info
            if (!isBreak) {
                cycleText.textContent = `Cycle ${currentCycle} of ${CYCLES_BEFORE_LONG_BREAK}`;
            } else {
                cycleText.textContent = currentCycle > CYCLES_BEFORE_LONG_BREAK ? 'Enjoy your long break!' : 'Take a break!';
            }

            updateCycleDots();
        }

        // Update cycle dots
        function updateCycleDots() {
            const dots = cycleDots.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.className = 'dot';
                if (index < currentCycle - 1) {
                    dot.classList.add('completed');
                } else if (index === currentCycle - 1 && !isBreak) {
                    dot.classList.add('current');
                }
            });
        }

        // Timer tick
        function tick() {
            if (timeRemaining > 0) {
                timeRemaining--;
                updateDisplay();
            } else {
                // Timer completed
                playNotificationSound();
                handleTimerComplete();
            }
        }

        // Handle timer completion
        function handleTimerComplete() {
            if (isBreak) {
                // Break ended, start next focus session
                isBreak = false;
                
                // Reset cycles if we just finished a long break
                if (currentCycle > CYCLES_BEFORE_LONG_BREAK) {
                    currentCycle = 1;
                }
                
                timeRemaining = FOCUS_TIME;
                stopTimer();
            } else {
                // Focus session ended, start break
                isBreak = true;
                
                // Determine break type
                if (currentCycle >= CYCLES_BEFORE_LONG_BREAK) {
                    timeRemaining = LONG_BREAK;
                    currentCycle++;
                } else {
                    timeRemaining = SHORT_BREAK;
                    currentCycle++;
                }
                
                stopTimer();
            }
            
            updateDisplay();
        }

        // Start timer
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                startBtn.textContent = 'Pause';
                startBtn.classList.add('pause');
                intervalId = setInterval(tick, 1000);
            }
        }

        // Stop timer
        function stopTimer() {
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.classList.remove('pause');
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        // Toggle timer
        function toggleTimer() {
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        // Play notification sound (using AudioContext for cross-browser compatibility)
        function playNotificationSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.log('Audio notification not available');
            }
        }

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Initial display
        updateDisplay();

        // Handle page visibility for pause when tab is hidden
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isRunning) {
                // Optional: you can choose to pause when tab is hidden
                // stopTimer();
            }
        });
    </script>
</body>
</html>
